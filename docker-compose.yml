services:
  postgres:
    image: postgres:16-alpine
    container_name: ysg-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ysg_user
      POSTGRES_PASSWORD: ysg_pass
      POSTGRES_DB: ysg_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ysg_user -d ysg_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    # ⚠️ Production: Use Supabase Postgres instead of this service.
    # See .env.example for Supabase connection string format.

  redis:
    image: redis:7-alpine
    container_name: ysg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # ⚠️ Production: Use Upstash Redis instead of this service.
    # See .env.example for Upstash connection details.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ysg-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ysg_user:ysg_pass@postgres:5432/ysg_db?schema=public
      # Production: Set DATABASE_URL to your Supabase connection string (with ?pgbouncer=true)
      # Example: postgresql://user:pass@aws-0-region.pooler.supabase.com:6543/postgres?pgbouncer=true&schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_TLS_ENABLED: "false"
      # Production: Set REDIS_HOST/REDIS_PORT/REDIS_PASSWORD from Upstash REST API details
      # Production: Set REDIS_TLS_ENABLED=true (Upstash requires TLS)
      # DIRECT_URL bypasses PgBouncer for Prisma schema operations (DDL)
      DIRECT_URL: postgresql://ysg_user:ysg_pass@postgres:5432/ysg_db?schema=public
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ysg-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-better-auth-secret}
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      DATABASE_URL: postgresql://ysg_user:ysg_pass@postgres:5432/ysg_db?schema=public
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  postgres_data: