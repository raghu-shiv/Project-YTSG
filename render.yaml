services:
  # Backend API Service
  - type: web
    name: ysg-backend
    runtime: image
    repo: https://github.com/raghu-shiv/Project-YTSG
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: ysg-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: ysg-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: ysg-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: ysg-redis
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://youtube-script-generator.vercel.app
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true

  # Redis Service
  - type: redis
    name: ysg-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # PostgreSQL Database
  - name: ysg-postgres
    plan: free
    databaseName: ysg_db
    user: ysg_user
    ipAllowList: []