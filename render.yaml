services:
  # Backend API Service
  - type: web
    name: ysg-backend
    runtime: image
    repo: https://github.com/raghu-shiv/Project-YTSG
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"

      # ─── Supabase PostgreSQL ─────────────────────────────────────────────────
      # Get your connection string from Supabase Dashboard → Project Settings → Database → Connection string (with PgBouncer, port 6543)
      # Example: postgresql://postgres.xxxxx:[YOUR-PASSWORD]@aws-0-ap-south-1.pooler.supabase.com:6543/postgres?pgbouncer=true&schema=public
      - key: DATABASE_URL
        sync: false

      # ── DIRECT_URL — Direct DB connection (port 5432, bypasses PgBouncer) ────
      # Required for "prisma db push" to work with Supabase PgBouncer.
      # Same credentials as DATABASE_URL but with port 5432 and WITHOUT pgBouncer=true.
      # Get it from Supabase Dashboard → Project Settings → Database → Direct connection
      # Example: postgresql://postgres.xxxxx:[YOUR-PASSWORD]@aws-0-ap-south-1.pooler.supabase.com:5432/postgres?schema=public
      - key: DIRECT_URL
        sync: false

      # ─── Upstash Redis ──────────────────────────────────────────────────────
      # Get these from Upstash Console → Your Database → REST API
      # Example: REDIS_HOST=us1-adequate-lion-12345.upstash.io
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS_ENABLED
        value: "true"

      # ─── Auth ───────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true

      # ─── OpenRouter ─────────────────────────────────────────────────────────
      - key: OPENROUTER_API_KEY
        sync: false

      # ─── Frontend URL ───────────────────────────────────────────────────────
      - key: FRONTEND_URL
        value: https://www.yt-scripts.online

      # ─── Razorpay ───────────────────────────────────────────────────────────
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ─── Admin ──────────────────────────────────────────────────────────────
      - key: ADMIN_SECRET_KEY
        sync: false

      # ─── Email (Resend) ─────────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false

    healthCheckPath: /api/health
    autoDeploy: true

# ⚠️ Render-managed Postgres and Redis are removed.
# Use Supabase Postgres (free tier) and Upstash Redis (free tier) instead.
# See .env.example for connection details.